name: tercen_json_path
version: 0.8.0+tercen1.0.0
description: "Tercen fork of RFC 9535 JSONPath implementation with async/stream support and @ dereferencing syntax for RefId resolution."
homepage: "https://github.com/tercen/json_path"
repository: "https://github.com/tercen/json_path"

environment:
  sdk: ^3.8.0

dependencies:
  iregexp: ^0.2.0
  maybe_just_nothing: ^0.5.2
  petitparser: ^7.0.0
  rfc_6901: ^0.2.0

dev_dependencies:
  check_coverage: ^0.0.4
  lints: ^6.0.0
  path: ^1.8.2
  test: ^1.21.1

cider:
  link_template:
    tag: https://github.com/f3ath/jessie/releases/tag/%tag%
    diff: https://github.com/f3ath/jessie/compare/%from%...%to%
